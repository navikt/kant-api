services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: "kant-api"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./local/postgres/init.sql:/docker-entrypoint-initdb.d/10-create-kant-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kant-api"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:

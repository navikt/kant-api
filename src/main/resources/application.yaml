spring:
  application:
    name: kant-api
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
        read-enums-using-to-string: false
        write-enums-using-to-string: false
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 3
      idle-timeout: 300000
      max-lifetime: 1800000
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate.type.json_format_mapper: jackson3
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
